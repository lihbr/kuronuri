name: validate

on: push

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - uses: actions/cache@v6
        with:
          path: .cache/sources
          key: sources-${{ hashFiles('src/fetch_sources.sh') }}
      - run: pnpm install
      - run: pnpm venv
      - run: pnpm lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - uses: actions/cache@v6
        with:
          path: .cache/sources
          key: sources-${{ hashFiles('src/fetch_sources.sh') }}
      - uses: actions/cache@v6
        with:
          path: |
            .cache
            !.cache/sources
          key: glyphs-${{ hashFiles('src/pixel.py') }}
          restore-keys: glyphs-
      - run: pnpm install
      - run: pnpm venv
      # a quick subset: one plain and one pixelated family
      - run: pnpm build --variants 0,100 --styles Regular
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  unit:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - uses: actions/cache@v6
        with:
          path: .cache/sources
          key: sources-${{ hashFiles('src/fetch_sources.sh') }}
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - run: pnpm install
      - run: pnpm venv
      - run: pnpm unit
